<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>仮面ライダーガヴ放送年月日計算サイト</title>
<style>
  body {
    text-align: center;
    font-family: sans-serif;
    padding: 20px;
  }

  input, button {
    font-size: 18px;
    padding: 10px;
    margin: 5px;
  }

  button {
    width: 120px;
  }
input {
  width: 80%;
  max-width: 300px;
}
</style>
</head>

<body>

<h2>仮面ライダーガヴ放送年月日計算サイト</h2>
<p style="color: gray;">1話〜50話の数字を入力してください</p>

<input type="number" id="ep" placeholder="何話？" onkeydown="handleKey(event)">
<button onclick="calc()">計算</button>

<p id="result"></p>

<script>
function handleKey(event) {
  if (event.key === "Enter") {
    calc();
  }
}
function calc() {
  let ep = Number(document.getElementById("ep").value);
  let year = 0;
		let month = 0;
		let day = 0;

		if (ep >= 1 && ep <= 50) {
			if (ep >= 1 && ep <= 16) {
				year = 2024;
				if (ep >= 1 && ep <= 5) {
					month = 9;
					day = 1 + 7 * (ep - 1);
				} else if (ep >= 6 && ep <= 9) {
					month = 10;
					day = 6 + 7 * (ep - 6);
				} else if (ep >= 10 && ep <= 12) {
					month = 11;
					day = 10 + 7 * (ep - 10);
				} else if (ep >= 13 && ep <= 16) {
					month = 12;
					day = 1 + 7 * (ep - 13);
				}
			} else if (ep >= 17 && ep <= 50) {
				year = 2025;
				if (ep >= 17 && ep <= 20) {
					month = 1;
					day = 5 + 7 * (ep - 17);
				} else if (ep >= 21 && ep <= 24) {
					month = 2;
					day = 2 + 7 * (ep - 21);
				} else if (ep >= 25 && ep <= 28) {
					month = 3;
					day = 2 + 7 * (ep - 25);
				} else if (ep >= 29 && ep <= 32) {
					month = 4;
					day = 6 + 7 * (ep - 29);
				} else if (ep >= 33 && ep <= 36) {
					month = 5;
					day = 4 + 7 * (ep - 33);
				} else if (ep >= 37 && ep <= 41) {
					month = 6;
					day = 1 + 7 * (ep - 37);
				} else if (ep >= 42 && ep <= 45) {
					month = 7;
					day = 6 + 7 * (ep - 42);
				} else if (ep >= 46 && ep <= 50) {
					month = 8;
					day = 3 + 7 * (ep - 46);
				}
			}
			document.getElementById("result").textContent = year + "年" + month + "月" + day + "日";
		} else {
          document.getElementById("result").textContent = "1話から50話までの数字を入力してください";
		}
	}
</script>
